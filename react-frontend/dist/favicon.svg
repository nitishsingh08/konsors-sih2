<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SPARC">
  <title>SPARC</title>
  <!--
    Optical small-size variant of the same mark, for the favicon and app icon.
    Same flame; the ring is heavier (r=24.5, 40 degree gap, 4.8 stroke) and the
    gap narrower, so both elements survive being rendered at 16 to 32 pixels.
  -->
  <defs>
    <linearGradient id="agni-flame" x1="32" y1="17.2" x2="32" y2="48.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E5484D"/>
      <stop offset=".55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="agni-ring" x1="9" y1="7" x2="55" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FB2DC"/>
      <stop offset="1" stop-color="#22405F"/>
    </linearGradient>
  </defs>
  <path d="M23.62 55.02A24.5 24.5 0 1 1 40.38 55.02" fill="none" stroke="url(#agni-ring)" stroke-width="4.8" stroke-linecap="round"/>
  <path d="M31 17.2C34.9 23.9 43 28.4 43 36.3C43 42.9 37.9 48.2 32 48.2C26.1 48.2 21 42.9 21 36.3C21 31.6 23.1 28.1 25.9 24.6C27.6 27.1 28.8 28.4 29.5 26.9C30.3 25.1 30.7 19.6 31 17.2Z" fill="url(#agni-flame)"/>
</svg>
